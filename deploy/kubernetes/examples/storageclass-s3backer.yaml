kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: csi-s3-block
provisioner: ch.ctrox.csi.s3-driver
reclaimPolicy: Delete
parameters:
  # s3backer presents the volume as a block device with a real XFS
  # filesystem on top: ownership, fsync and renames have normal
  # semantics, which databases and other POSIX-heavy workloads need.
  # Requires the <version>-full driver image and csi-driver.yaml
  # (fsGroupPolicy: File) to be deployed.
  mounter: s3backer
  # bucket + prefix, no usePrefix: every volume becomes its own folder
  # <prefix>/<volume-id> inside the bucket
  bucket: YOUR_BUCKET_HERE
  prefix: infrastructure/k8s-volumes
  csi.storage.k8s.io/provisioner-secret-name: csi-s3-secret
  csi.storage.k8s.io/provisioner-secret-namespace: kube-system
  csi.storage.k8s.io/controller-publish-secret-name: csi-s3-secret
  csi.storage.k8s.io/controller-publish-secret-namespace: kube-system
  csi.storage.k8s.io/node-stage-secret-name: csi-s3-secret
  csi.storage.k8s.io/node-stage-secret-namespace: kube-system
  csi.storage.k8s.io/node-publish-secret-name: csi-s3-secret
  csi.storage.k8s.io/node-publish-secret-namespace: kube-system
