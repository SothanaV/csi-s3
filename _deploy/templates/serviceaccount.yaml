{{- $ns := include "csi-s3.namespace" . -}}
{{- range $component, $cfg := .Values.serviceAccounts }}
{{- if $cfg.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "csi-s3.serviceAccountName" (dict "root" $ "component" $component) }}
  namespace: {{ $ns }}
  labels:
    {{- include "csi-s3.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $cfg.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
