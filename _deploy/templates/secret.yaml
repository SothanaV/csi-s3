{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  # the namespace must match the secretNamespace of every storage class
  # that references it
  name: {{ include "csi-s3.secretName" . }}
  namespace: {{ include "csi-s3.namespace" . }}
  labels:
    {{- include "csi-s3.labels" . | nindent 4 }}
  {{- with .Values.secret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  accessKeyID: {{ .Values.secret.accessKeyID | quote }}
  secretAccessKey: {{ .Values.secret.secretAccessKey | quote }}
  endpoint: {{ .Values.secret.endpoint | quote }}
  region: {{ .Values.secret.region | quote }}
  skipSSLVerify: {{ .Values.secret.skipSSLVerify | quote }}
  {{- range $key, $value := .Values.secret.extra }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
